<!-- Golden Vacation & Travel: the Black Friday countdown bar.
     Netlify: Project configuration > Build & deploy > Post processing > Snippet injection > Add snippet,
     name it "Black Friday bar", choose "Insert before </body>", paste everything below this comment, Save.
     It shows on every page except the Black Friday page itself and the quote, sent and booked pages,
     counts down to Thu Nov 19, 8am Jamaica time, then to Mon Nov 30, 11:59pm, then removes itself,
     so it can stay in place until you delete it in December. Same times as data/black-friday.json. -->
<style>
.gvbf{position:relative;z-index:30;background:#0E0F0E;color:#fff;border-bottom:2px solid #F2B93B;font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif}
.gvbf a.gvbf-a{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 10px;min-height:40px;padding:6px 46px 6px 14px;color:#fff;text-decoration:none;font-size:13px;line-height:1.25;text-align:center}
.gvbf a.gvbf-a:hover{color:#fff}
.gvbf b{color:#F2B93B;font-weight:900;letter-spacing:.06em}
.gvbf .gvbf-t{font-weight:800;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.gvbf u{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.gvbf a.gvbf-a:hover u{color:#F2B93B}
.gvbf-x{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:flex;align-items:center;justify-content:center;padding:0;background:none;border:0;color:#fff;opacity:.75;cursor:pointer}
.gvbf-x:hover{opacity:1}
@media (max-width:389px){.gvbf u{display:none}}
@media (min-width:900px){.gvbf a.gvbf-a{font-size:14px;gap:14px}}
</style>
<script>
(function () {
  var OPEN = Date.parse("2026-11-19T13:00:00Z"), END = Date.parse("2026-12-01T04:59:59Z"), p = location.pathname;
  if (Date.now() > END) return;
  if (/^\/(black-friday|q|review)(\/|$)/.test(p) || /\/(quote|sent|booked)(\/|\.html|$)/.test(p)) return;
  try { if (sessionStorage.getItem("gvbf-x")) return; } catch (e) {}
  var bar = document.createElement("div");
  bar.className = "gvbf";
  bar.setAttribute("role", "region");
  bar.setAttribute("aria-label", "Black Friday");
  bar.innerHTML = '<a class="gvbf-a" href="/black-friday/"><b>BLACK FRIDAY</b><span class="gvbf-w"></span><span class="gvbf-t"></span><u></u></a>' +
    '<button class="gvbf-x" type="button" aria-label="Close the Black Friday bar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>';
  document.body.insertBefore(bar, document.body.firstChild);
  var w = bar.querySelector(".gvbf-w"), t = bar.querySelector(".gvbf-t"), u = bar.querySelector("u"), iv;
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function tick() {
    var now = Date.now(), live = now >= OPEN, ms = (live ? END : OPEN) - now;
    if (ms <= 0 && live) { clearInterval(iv); bar.remove(); return; }
    var s = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    w.textContent = live ? "is on · ends in" : "opens in";
    t.textContent = (d ? d + "d " : "") + pad(h) + "h " + pad(m) + "m " + pad(s % 60) + "s";
    u.textContent = live ? "See the deals" : "Get first pick";
  }
  tick();
  iv = setInterval(tick, 1000);
  bar.querySelector(".gvbf-x").addEventListener("click", function () {
    clearInterval(iv); bar.remove();
    try { sessionStorage.setItem("gvbf-x", "1"); } catch (e) {}
  });
  bar.querySelector(".gvbf-a").addEventListener("click", function () {
    try { if (typeof window.gtag === "function") window.gtag("event", "bf_bar_click", { state: Date.now() >= OPEN ? "live" : "soon", page: p }); } catch (e) {}
  });
})();
</script>
